{% extends "base.html" %}
{% block title %}WIP - Mock MES{% endblock %}
{% block content %}
<h1>WIP / 재공</h1>
<section class="panel">
  <table>
    <thead><tr><th>Seq</th><th>Step code</th><th>Step name</th><th>Lot count</th><th>Wafer qty</th></tr></thead>
    <tbody>
      {% for row in rows %}
      <tr><td>{{ row.seq }}</td><td>{{ row.step_code }}</td><td>{{ row.step_name }}</td><td>{{ row.lot_count }}</td><td>{{ row.wafer_qty }}</td></tr>
      {% endfor %}
    </tbody>
  </table>
</section>
{% endblock %}
