name: build-images

# Build and push the two PUBLIC GHCR images used by Azure Container Apps:
#   ghcr.io/changju-ahn/mock-mes-app    (init + api + mcp share this image)
#   ghcr.io/changju-ahn/mock-mes-proxy  (Caddy reverse proxy)
#
# Images are public so ACA can pull them with no registry secret. Package
# visibility is set once (see README); pushes thereafter keep that visibility.

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: mock-mes-app
            context: .
            dockerfile: ./Dockerfile
          - image: mock-mes-proxy
            context: ./proxy
            dockerfile: ./proxy/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out image tags
        id: tags
        # Every build publishes an immutable :sha tag. Only main moves
        # :latest, which is what the deployed Container App pulls on every
        # replica start -- otherwise a push to any feature branch silently
        # replaces production with unreviewed code.
        run: |
          repo="ghcr.io/changju-ahn/${{ matrix.image }}"
          {
            echo 'value<<TAGS_EOF'
            echo "$repo:${{ github.sha }}"
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              echo "$repo:latest"
            fi
            echo 'TAGS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.value }}
