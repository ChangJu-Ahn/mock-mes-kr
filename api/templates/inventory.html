{% extends "base.html" %}
{% block title %}Inventory - Mock MES{% endblock %}
{% block content %}
<h1>Inventory / 재고</h1>
<section class="panel">
  <form method="get" action="/inventory" class="inline-form">
    <input name="category" value="{{ filters.category }}" placeholder="Category">
    <input name="location" value="{{ filters.location }}" placeholder="Location">
    <button type="submit">Filter</button>
  </form>
  <table>
    <thead><tr><th>Code</th><th>Name</th><th>Category</th><th>Qty</th><th>UOM</th><th>Location</th></tr></thead>
    <tbody>
      {% for row in rows %}
      <tr><td>{{ row.item_code }}</td><td>{{ row.item_name }}</td><td>{{ row.category }}</td><td>{{ row.qty }}</td><td>{{ row.uom }}</td><td>{{ row.location }}</td></tr>
      {% endfor %}
    </tbody>
  </table>
</section>
{% endblock %}
